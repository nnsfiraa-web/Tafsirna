
<script>
const q = document.getElementById('question');
const m = document.getElementById('messages');
const b = document.getElementById('send');

const API_URL =
  'https://ftxtulwrrxodbifhzdpv.supabase.co/functions/v1/dynamic-responder';

const SUPABASE_KEY =
  'sb_publishable_zT0GXc5WJh048qJkfEhAsg_ovOCjPSi';

function addMessage(text, type) {
  const el = document.createElement('div');
  el.className = 'msg ' + type;
  el.textContent = text;
  m.appendChild(el);
  m.scrollTop = m.scrollHeight;
  return el;
}

async function send() {
  const question = q.value.trim();
  if (!question || b.disabled) return;

  addMessage(question, 'user');
  q.value = '';

  const loading = addMessage(
    'Tafsirna sedang memproses pertanyaanmu...',
    'bot'
  );

  b.disabled = true;
  b.textContent = 'Memproses...';

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ question })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.details || data.error || 'Permintaan gagal.'
      );
    }

    if (!data.answer) {
      throw new Error('Jawaban AI tidak ditemukan.');
    }

    loading.textContent = data.answer;

  } catch (error) {
    console.error('Tafsirna error:', error);
    loading.textContent =
      'Maaf, terjadi kendala saat memproses pertanyaan. ' +
      error.message;
  } finally {
    b.disabled = false;
    b.textContent = 'Kirim pertanyaan ↗';
    m.scrollTop = m.scrollHeight;
  }
}

b.addEventListener('click', send);

q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
